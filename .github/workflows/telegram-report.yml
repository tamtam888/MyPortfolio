name: Daily Portfolio Analytics Report

on:
  workflow_dispatch:
  schedule:
    # Runs at 18:00 Israel time during daylight saving time (15:00 UTC).
    # GitHub Actions cron uses UTC.
    - cron: '0 15 * * *'

jobs:
  send-telegram-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram analytics report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone

          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_KEY",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]

          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required secrets: {', '.join(missing)}")

          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_KEY"]
          telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
          telegram_chat_id = os.environ["TELEGRAM_CHAT_ID"]

          def supabase_get(endpoint):
              url = f"{supabase_url}/rest/v1/{endpoint}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "apikey": service_key,
                      "Authorization": f"Bearer {service_key}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              last_24h_rows = supabase_get("analytics_last_24_hours?select=*")
              daily_rows    = supabase_get("analytics_daily_summary?select=date,total_page_views,unique_visitors,total_clicks&order=date.desc&limit=2")
              click_rows    = supabase_get("analytics_click_summary?select=event_type,total_clicks&order=total_clicks.desc")
              project_rows  = supabase_get("analytics_project_click_summary?select=target,total_clicks&order=total_clicks.desc")
              source_rows   = supabase_get("analytics_source_summary?select=source,total_views&order=total_views.desc&limit=20")
          except Exception as exc:
              raise SystemExit(f"Failed to read analytics data from Supabase: {exc}")

          summary = last_24h_rows[0] if last_24h_rows else {}

          total_page_views = summary.get("total_page_views") or 0
          unique_visitors  = summary.get("unique_visitors") or 0
          total_clicks     = summary.get("total_clicks") or 0
          top_source       = summary.get("top_source") or "none"
          top_page         = summary.get("top_page") or "none"

          # --- Yesterday comparison (calendar day totals) ---
          today_row     = daily_rows[0] if len(daily_rows) > 0 else {}
          yesterday_row = daily_rows[1] if len(daily_rows) > 1 else {}
          has_yesterday = bool(yesterday_row)

          def fmt_delta(today_val, yest_val):
              d = today_val - yest_val
              if d > 0: return f"  (▲ +{d} vs yesterday)"
              if d < 0: return f"  (▼ {d} vs yesterday)"
              return "  (→ 0 vs yesterday)"

          if has_yesterday:
              views_delta    = fmt_delta(today_row.get("total_page_views") or 0, yesterday_row.get("total_page_views") or 0)
              visitors_delta = fmt_delta(today_row.get("unique_visitors") or 0,  yesterday_row.get("unique_visitors") or 0)
              clicks_delta   = fmt_delta(today_row.get("total_clicks") or 0,     yesterday_row.get("total_clicks") or 0)
          else:
              views_delta = visitors_delta = clicks_delta = ""

          # --- Readable click labels ---
          CLICK_LABELS = {
              "github_click":   "GitHub",
              "linkedin_click": "LinkedIn",
              "cv_download":    "CV Download",
              "contact_click":  "Contact",
              "project_click":  "Project cards",
          }

          click_lines = []
          for row in click_rows[:5]:
              label  = CLICK_LABELS.get(row.get("event_type") or "", row.get("event_type") or "unknown")
              clicks = row.get("total_clicks") or 0
              click_lines.append(f"- {label}: {clicks}")
          if not click_lines:
              click_lines.append("- No clicks yet")

          project_lines = []
          for row in project_rows[:5]:
              target = row.get("target") or "unknown"
              clicks = row.get("total_clicks") or 0
              project_lines.append(f"- {target}: {clicks}")
          if not project_lines:
              project_lines.append("- No project clicks yet")

          # --- Traffic source labels ---
          def normalize_source_label(raw):
              s = (raw or "direct").lower().strip()
              SOURCE_MAP = {
                  "linkedin":                "LinkedIn",
                  "linkedin.com":            "LinkedIn",
                  "www.linkedin.com":        "LinkedIn",
                  "linkedin_dm":             "LinkedIn DM",
                  "facebook":                "Facebook",
                  "facebook.com":            "Facebook",
                  "www.facebook.com":        "Facebook",
                  "l.facebook.com":          "Facebook",
                  "lm.facebook.com":         "Facebook",
                  "whatsapp":                "WhatsApp",
                  "web.whatsapp.com":        "WhatsApp",
                  "cv":                      "CV",
                  "github":                  "GitHub",
                  "github.com":              "GitHub",
                  "direct":                  "Direct",
                  "none":                    "None",
                  "tamtam888.github.io":     "Internal navigation",
                  "www.tamtam888.github.io": "Internal navigation",
              }
              return SOURCE_MAP.get(s, s.capitalize())

          # Aggregate totals by readable label before trimming to top 5.
          # Multiple raw sources that map to the same label (e.g. facebook.com
          # and l.facebook.com both → "Facebook") are summed into one entry.
          source_totals = {}
          for row in source_rows:
              label = normalize_source_label(row.get("source"))
              views = row.get("total_views") or 0
              source_totals[label] = source_totals.get(label, 0) + views

          source_lines = []
          for label, views in sorted(source_totals.items(), key=lambda x: x[1], reverse=True)[:5]:
              source_lines.append(f"- {label}: {views} views")
          if not source_lines:
              source_lines.append("- No source data yet")

          # --- Insight sentence ---
          today_views_daily = today_row.get("total_page_views") or 0
          yest_views_daily  = yesterday_row.get("total_page_views") or 0

          if total_page_views == 0:
              insight = "No visits recorded in the last 24 hours."
          elif not has_yesterday:
              insight = "Not enough history for a comparison yet."
          elif yest_views_daily > 0:
              pct = (today_views_daily - yest_views_daily) / yest_views_daily * 100
              if pct >= 50:
                  insight = "Traffic is up significantly vs yesterday."
              elif pct <= -50:
                  insight = "Traffic is notably down vs yesterday."
              elif top_source not in ("direct", "none"):
                  insight = f"Most traffic arrived from {top_source} today."
              else:
                  insight = "Traffic is steady compared to yesterday."
          elif top_source not in ("direct", "none"):
              insight = f"Most traffic arrived from {top_source} today."
          else:
              insight = "Traffic is steady compared to yesterday."

          # --- Report date header ---
          now = datetime.now(timezone.utc)
          report_date = f"{now.day} {now.strftime('%b %Y')}"

          message = "\n".join([
              f"📊 Portfolio Report — {report_date}",
              "",
              "Last 24 hours:",
              f"👁 Page views: {total_page_views}{views_delta}",
              f"👤 Unique visitors: {unique_visitors}{visitors_delta}",
              f"🖱 Total clicks: {total_clicks}{clicks_delta}",
              f"🔗 Top source: {top_source}",
              f"📄 Top page: {top_page}",
              "",
              "Clicks by type:",
              *click_lines,
              "",
              "Project clicks:",
              *project_lines,
              "",
              "Traffic sources:",
              *source_lines,
              "",
              f"💡 {insight}",
          ])

          telegram_url = f"https://api.telegram.org/bot{telegram_token}/sendMessage"
          payload = json.dumps({
              "chat_id": telegram_chat_id,
              "text": message,
              "disable_web_page_preview": True,
          }).encode("utf-8")

          request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"Failed to send Telegram message: {exc}")

          if not result.get("ok"):
              raise SystemExit(f"Telegram API returned an error: {result}")

          print("Telegram analytics report sent successfully.")
          PY
